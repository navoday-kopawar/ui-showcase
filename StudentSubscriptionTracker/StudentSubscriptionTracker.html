    <script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .app-shell {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .app-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        overflow-y: auto;
        transition: transform 0.3s;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
      }
      .sidebar-overlay {
        display: none;
      }
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          height: 100%;
          z-index: 50;
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar-overlay.open {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.4);
          z-index: 40;
        }
      }
      .tab-active {
        border-bottom: 2px solid;
        font-weight: 600;
      }
      .toast {
        animation:
          slideIn 0.3s ease,
          fadeOut 0.3s ease 2.7s;
      }
      @keyframes slideIn {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .modal-backdrop {
        animation: fadeIn 0.2s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .stat-card {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
    </style>
    <style>
      body {
        box-sizing: border-box;
      }
    </style>

          state.currentPage = 'dashboard';
          render();
          showToast(`Impersonating ${u.name}`);

      window.openTenantModal = () => {
         showToast("Tenant Creation form feature coming in next iteration!", "info");
      };

      // ==================== DASHBOARD ====================
      function renderDashboard(el) {
        const activeStudents = state.students.filter(
          (s) => s.status === "active" && s.tenantId === state.currentTenantId,
        ).length;
        const activeSubs = state.subscriptions.filter(
          (s) => s.status === "active" && s.tenantId === state.currentTenantId,
        ).length;
        const totalRevenue = state.payments
          .filter((p) => p.status === "completed" || p.status === "partial")
          .reduce((a, p) => a + p.paidAmount, 0);
        const expiredSubs = state.subscriptions.filter(
          (s) => s.status === "expired",
        ).length;
        const pendingPayments = state.payments.filter(
          (p) => p.status === "pending" || p.status === "partial",
        ).length;

        el.innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div><h1 class="text-2xl font-bold text-gray-900">Dashboard</h1><p class="text-sm text-gray-500">Overview of your institution</p></div>
        <span class="text-sm text-gray-400 font-mono">${new Date().toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "short", day: "numeric" })}</span>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        ${[
          {
            label: "Total Students",
            value: state.students.length,
            icon: "users",
            color: "indigo",
            emoji: "👥",
          },
          {
            label: "Active Subs",
            value: activeSubs,
            icon: "credit-card",
            color: "emerald",

            icon: "banknote",
            color: "blue",

          },
          {
            label: "Expired",
            value: expiredSubs,
            icon: "clock",
            color: "red",
            emoji: "⏰",
          },
          {
            label: "Pending Pay",
            value: pendingPayments,
            icon: "alert-circle",
            color: "amber",
            emoji: "⚠️",
          },
        ]
          .map(
            (k) => `
          <div class="stat-card bg-white rounded-xl p-4 border border-gray-100 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="text-2xl">${k.emoji}</span>
              <i data-lucide="${k.icon}" class="w-4 h-4 text-gray-300"></i>
            </div>
            <div class="text-xl font-bold text-gray-900">${k.value}</div>
            <div class="text-xs text-gray-500 mt-0.5">${k.label}</div>
          </div>
        `,
          )
          .join("")}
      </div>
      <div class="bg-white rounded-xl p-5 border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-900">Recent Students</h3>
          <button onclick="state.currentPage='students';renderPage();updateNav();" class="text-xs text-indigo-600 hover:underline">View All →</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-gray-400 text-xs border-b">
              <th class="pb-2 font-medium">Student</th><th class="pb-2 font-medium">Course</th><th class="pb-2 font-medium">Status</th><th class="pb-2 font-medium">Joined</th>
            </tr></thead>
            <tbody>
              ${state.students
                .slice(0, 5)
                .map(
                  (s) => `<tr class="border-b border-gray-50 hover:bg-gray-50">
                <td class="py-2.5"><div class="flex items-center gap-2"><span class="text-lg">${s.avatar}</span><div><div class="font-medium text-gray-900">${s.name}</div><div class="text-xs text-gray-400">${s.id}</div></div></div></td>
                <td class="py-2.5 text-gray-600">${s.course}</td>
                <td class="py-2.5">${statusBadge(s.status)}</td>
                <td class="py-2.5 text-gray-500">${s.joinDate}</td>
              </tr>`,
                )
                .join("")}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
      }

      // ==================== STUDENTS ====================
      function renderStudents(el) {
        el.innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-5">
        <div><h1 class="text-2xl font-bold text-gray-900">Students</h1><p class="text-sm text-gray-500">Manage all students</p></div>
        <button id="addStudentBtn" class="primary-btn flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:opacity-90">
          <i data-lucide="user-plus" class="w-4 h-4"></i> Enroll Student
        </button>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
        <div class="p-4 border-b flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
            <input id="studentSearch" type="text" placeholder="Search students..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
          <select id="studentFilter" class="px-3 py-2 border rounded-lg text-sm outline-none">
            <option value="">All Status</option><option value="active">Active</option><option value="expired">Expired</option><option value="blocked">Blocked</option>
          </select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-gray-400 text-xs border-b bg-gray-50">
              <th class="px-4 py-3 font-medium">Student</th><th class="px-4 py-3 font-medium">Contact</th><th class="px-4 py-3 font-medium">Course</th><th class="px-4 py-3 font-medium">Status</th><th class="px-4 py-3 font-medium">Actions</th>
            </tr></thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="mt-6 bg-white rounded-xl p-5 border border-gray-100 shadow-sm">
        <h3 class="font-semibold text-gray-900 mb-3 flex items-center gap-2">🚫 Blocked Students</h3>
        <div id="blockedList" class="space-y-2"></div>
      </div>
    </div>
    <div id="studentModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="modal-backdrop absolute inset-0 bg-black/40" id="studentModalBg"></div>
      <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90%] overflow-y-auto p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 id="studentModalTitle" class="text-lg font-bold">Enroll Student</h3>
          <button id="closeStudentModal" class="p-1 hover:bg-gray-100 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form id="studentForm" class="space-y-4">
          <input type="hidden" id="editStudentId">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div><label class="block text-xs font-medium text-gray-600 mb-1">Full Name</label><input id="sName" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200"></div>
            <div><label class="block text-xs font-medium text-gray-600 mb-1">Email</label><input id="sEmail" type="email" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200"></div>
            <div><label class="block text-xs font-medium text-gray-600 mb-1">Phone</label><input id="sPhone" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200"></div>
          </div>
          <div id="statusContainer" class="hidden"><label class="block text-xs font-medium text-gray-600 mb-1">Status</label><select id="sStatus" class="w-full px-3 py-2 border rounded-lg text-sm outline-none"><option value="active">Active</option><option value="expired">Expired</option><option value="blocked">Blocked</option></select></div>
          <div class="border-t pt-3">
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-semibold text-gray-900">Courses & Plans</label>
              <button type="button" onclick="addCourseRow()" class="text-xs text-indigo-600 hover:underline font-medium">+ Add Course</button>
            </div>
            <div id="courseRows" class="space-y-2"></div>
          </div>
          <div class="border-t pt-3">
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-semibold text-gray-900">Installments / Payments</label>
              <button type="button" onclick="addInstallmentRow()" class="text-xs text-indigo-600 hover:underline font-medium">+ Add Installment</button>
            </div>
            <div id="installmentRows" class="space-y-2"></div>
          </div>
          <button type="submit" class="primary-btn w-full py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:opacity-90 mt-2">Save Student</button>
        </form>
      </div>
    </div>

  `;
        renderStudentTable();
        renderBlockedList();

        $("addStudentBtn").onclick = () => openStudentModal();
        $("closeStudentModal").onclick = () =>
          $("studentModal").classList.add("hidden");
        $("studentModalBg").onclick = () =>
          $("studentModal").classList.add("hidden");

        $("studentSearch").oninput = renderStudentTable;
        $("studentFilter").onchange = renderStudentTable;
        window.courseOpts = `<option>Full Stack Development</option><option>Data Science</option><option>UI/UX Design</option><option>Digital Marketing</option><option>Mobile App Development</option>`;
        window.addCourseRow = (data = {}) => {
          const div = document.createElement("div");
          div.className = "course-row flex items-start gap-2 bg-gray-50 p-3 rounded-lg border";
          const planOpts = state.plans.map(p => `<option value="${p.id}" ${data.planId===p.id?'selected':''}>${p.name}</option>`).join("");
          div.innerHTML = `
            <input type="hidden" class="c-id" value="${data.id || ''}">
            <input type="hidden" class="c-start" value="${data.startDate || ''}">
            <div class="flex-1 min-w-[120px]"><label class="block text-[10px] text-gray-500 mb-1">Course</label><select class="c-name w-full px-2 py-1.5 border rounded text-xs select-course">${window.courseOpts}</select></div>
            <div class="flex-1 min-w-[120px]"><label class="block text-[10px] text-gray-500 mb-1">Plan</label><select class="c-plan w-full px-2 py-1.5 border rounded text-xs" onchange="this.closest('.course-row').querySelector('.c-dur').value=getPlan(this.value)?.duration||1">${planOpts}</select></div>
            <div class="w-16"><label class="block text-[10px] text-gray-500 mb-1">Dur(mo)</label><input type="number" class="c-dur w-full px-2 py-1.5 border rounded text-xs" value="${data.duration || (state.plans[0]?getPlan(state.plans[0].id).duration:1)}"></div>
            <div class="w-40">
              <label class="flex justify-between items-center text-[10px] text-gray-500 mb-1">
                <span>Validity Till</span>
                ${data.id ? `<button type="button" onclick="let inp=this.parentElement.nextElementSibling; let d=new Date(inp.value); d.setMonth(d.getMonth()+parseInt(this.closest('.course-row').querySelector('.c-dur').value||1)); inp.value=d.toISOString().split('T')[0]; showToast('Plan dynamically extended!');" class="text-indigo-600 hover:text-indigo-800 font-semibold px-1 rounded hover:bg-indigo-50 transition">Extend</button>` : ''}
              </label>
              <input type="date" class="c-end w-full px-2 py-1.5 border rounded text-xs" value="${data.endDate || ''}">
            </div>
            <div class="w-16"><label class="block text-[10px] text-gray-500 mb-1">Disc(₹)</label><input type="number" class="c-disc w-full px-2 py-1.5 border rounded text-xs" value="${data.discount || 0}"></div>
            <button type="button" onclick="this.closest('.course-row').remove()" class="mt-5 text-red-400 hover:text-red-500"><i data-lucide="trash" class="w-4 h-4"></i></button>
          `;
          if(data.course) div.querySelector(".c-name").value = data.course;
          $("courseRows").appendChild(div);
          lucide.createIcons({root: div});
        };

        window.addInstallmentRow = (data = {}) => {
          const div = document.createElement("div");
          div.className = "installment-row flex flex-wrap sm:flex-nowrap items-start gap-2 bg-gray-50 p-3 rounded-lg border";
          div.innerHTML = `
            <input type="hidden" class="i-id" value="${data.id || ''}">
            <div class="w-full sm:w-24"><label class="block text-[10px] text-gray-500 mb-1">Amt(₹)</label><input type="number" required class="i-amt w-full px-2 py-1.5 border rounded text-xs" value="${data.amount || ''}"></div>
            <div class="w-full sm:w-24"><label class="block text-[10px] text-gray-500 mb-1">Paid(₹)</label><input type="number" required class="i-paid w-full px-2 py-1.5 border rounded text-xs" value="${data.paidAmount ?? 0}"></div>
            <div class="w-full sm:w-32"><label class="block text-[10px] text-gray-500 mb-1">Due Date</label><input type="date" required class="i-due w-full px-2 py-1.5 border rounded text-xs" value="${data.dueDate || ''}"></div>
            <div class="flex-1"><label class="block text-[10px] text-gray-500 mb-1">Status</label>
              <select class="i-status w-full px-2 py-1.5 border rounded text-xs">
                <option value="pending" ${data.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="partial" ${data.status === 'partial' ? 'selected' : ''}>Partial</option>
                <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="delayed" ${data.status === 'delayed' ? 'selected' : ''}>Delayed</option>
              </select>
            </div>
            <button type="button" onclick="this.closest('.installment-row').remove()" class="mt-1 sm:mt-5 text-red-400 hover:text-red-500"><i data-lucide="trash" class="w-4 h-4"></i></button>
          `;
          $("installmentRows").appendChild(div);
          lucide.createIcons({root: div});
        };

        $("studentForm").onsubmit = (e) => {
          e.preventDefault();
          const eid = $("editStudentId").value;
          
          const courses = [];
          document.querySelectorAll('.course-row').forEach(row => {
            courses.push({
              id: row.querySelector('.c-id').value,
              startDate: row.querySelector('.c-start').value,
              endDate: row.querySelector('.c-end').value,
              course: row.querySelector('.c-name').value,
              planId: row.querySelector('.c-plan').value,
              duration: parseInt(row.querySelector('.c-dur').value) || 0,
              discount: parseInt(row.querySelector('.c-disc').value) || 0
            });
          });
          
          const installs = [];
          document.querySelectorAll('.installment-row').forEach((row, idx) => {
            installs.push({
              id: row.querySelector('.i-id').value,
              installment: idx + 1,
              amount: parseFloat(row.querySelector('.i-amt').value) || 0,
              paidAmount: parseFloat(row.querySelector('.i-paid').value) || 0,
              dueDate: row.querySelector('.i-due').value,
              status: row.querySelector('.i-status').value
            });
          });

          const courseSummary = courses.map(c => c.course).join(", ") || "No courses";

          if (eid) {
            const s = getStudent(eid);
            s.name = $("sName").value;
            s.email = $("sEmail").value;
            s.phone = $("sPhone").value;
            s.course = courseSummary;
            s.status = $("sStatus").value;

            // Simple update: remove old subs/payments for this student, insert new
            state.subscriptions = state.subscriptions.filter(x => x.studentId !== eid);
            state.payments = state.payments.filter(x => x.studentId !== eid);

            courses.forEach(c => {
              const start = c.startDate || new Date().toISOString().split("T")[0];
              let endStr = c.endDate;
              if (!endStr) {
                const end = new Date(start);
                end.setMonth(end.getMonth() + c.duration);
                endStr = end.toISOString().split("T")[0];
              }
              state.subscriptions.push({
                id: c.id || ("SUB" + String(Date.now()).slice(-4) + Math.floor(Math.random()*100)),
                studentId: eid,
                planId: c.planId,
                startDate: start,
                endDate: endStr,
                status: "active",
                courseAccess: true,
                derivedCourseName: c.course,
                discount: c.discount,
                tenantId: state.currentTenantId
              });
            });

            installs.forEach(i => {
              state.payments.push({
                id: i.id || ("PAY" + String(Date.now()).slice(-4) + Math.floor(Math.random()*100)),
                studentId: eid,
                subscriptionId: state.subscriptions.find(sub => sub.studentId === eid)?.id || "",
                installment: i.installment,
                amount: i.amount,
                paidAmount: i.paidAmount,
                dueDate: i.dueDate,
                paidDate: (i.status === 'completed' && i.paidAmount > 0) ? new Date().toISOString().split("T")[0] : null,
                status: i.status,
                tenantId: state.currentTenantId
              });
            });

            showToast("Student updated!");
          } else {
            const id = "STU" + String(state.students.length + 1).padStart(3, "0");
            state.students.push({
              id,
              name: $("sName").value,
              email: $("sEmail").value,
              phone: $("sPhone").value,
              status: $("sStatus").value,
              joinDate: new Date().toISOString().split("T")[0],
              course: courseSummary,
              avatar: ["🧑‍💻", "👩‍🔬", "🧑‍🎨", "👩‍💼", "👨‍💻"][Math.floor(Math.random() * 5)],
              tenantId: state.currentTenantId,
            });

            courses.forEach(c => {
              const start = new Date().toISOString().split("T")[0];
              let endStr = c.endDate;
              if (!endStr) {
                const end = new Date(start);
                end.setMonth(end.getMonth() + c.duration);
                endStr = end.toISOString().split("T")[0];
              }
              state.subscriptions.push({
                id: "SUB" + String(Date.now()).slice(-4) + Math.floor(Math.random()*100),
                studentId: id,
                planId: c.planId,
                startDate: start,
                endDate: endStr,
                status: "active",
                courseAccess: true,
                derivedCourseName: c.course,
                discount: c.discount,
                tenantId: state.currentTenantId
              });
            });

            installs.forEach(i => {
              state.payments.push({
                id: "PAY" + String(Date.now()).slice(-4) + Math.floor(Math.random()*100),
                studentId: id,
                subscriptionId: state.subscriptions.find(sub => sub.studentId === id)?.id || "",
                installment: i.installment,
                amount: i.amount,
                paidAmount: i.paidAmount,
                dueDate: i.dueDate,

      function renderBlockedList() {
        const blocked = state.students.filter((s) => s.status === "blocked");

          ? blocked

                (s) => `
    <div class="flex items-center justify-between p-3 bg-red-50 rounded-lg">
      <div class="flex items-center gap-2"><span>${s.avatar}</span><div><span class="font-medium text-sm">${s.name}</span><span class="text-xs text-gray-500 ml-2">${s.id}</span></div></div>

      function openStudentModal(id) {
        const m = $("studentModal");
        m.classList.remove("hidden");
        $("courseRows").innerHTML = "";
        $("installmentRows").innerHTML = "";
        if (id) {
          const s = getStudent(id);
          $("studentModalTitle").textContent = "Edit Student";
          $("editStudentId").value = id;
          $("sName").value = s.name;
          $("sEmail").value = s.email;
          $("sPhone").value = s.phone;
          $("sStatus").value = s.status;
          $("statusContainer").classList.remove("hidden");

          // Populate existing courses
          const subs = state.subscriptions.filter(x => x.studentId === id);
          if(subs.length) {
            subs.forEach(sub => {
              addCourseRow({
                id: sub.id,
                startDate: sub.startDate,
                endDate: sub.endDate,
                course: sub.derivedCourseName || s.course.split(",")[0] || "Full Stack Development",
                planId: sub.planId,
                duration: getPlan(sub.planId)?.duration || 1,
                discount: sub.discount || 0
              });
            });
          } else {
            addCourseRow();
          }

          // Populate existing installments
          const pays = state.payments.filter(x => x.studentId === id);
          if(pays.length) {
            pays.forEach(p => addInstallmentRow(p));
          } else {
            addInstallmentRow();
          }

        } else {
          $("studentModalTitle").textContent = "Enroll Student";
          $("editStudentId").value = "";
          $("statusContainer").classList.add("hidden");
          $("sStatus").value = "active";
          $("studentForm").reset();
          addCourseRow();
          addInstallmentRow();
        }
        lucide.createIcons();
      }

        // Inline confirm
        const row = document
          .querySelector(`button[onclick="deleteStudent('${id}')"]`)
          .closest("tr");
        const cell = row.querySelector("td:last-child");
        const orig = cell.innerHTML;
        cell.innerHTML = `<div class="flex items-center gap-1"><span class="text-xs text-red-600">Delete?</span><button onclick="confirmDelete('${id}')" class="text-xs px-2 py-1 bg-red-500 text-white rounded">Yes</button><button onclick="cancelDelete(this)" class="text-xs px-2 py-1 bg-gray-200 rounded">No</button></div>`;

        state.students = state.students.filter((s) => s.id !== id);

        const cell = btn.closest("td");

        renderBlockedList();

                 <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><div class="flex items-center justify-between mb-1"><div class="font-medium text-gray-900 text-sm">${l.action}</div><time class="text-xs font-medium text-indigo-500">${l.date}</time></div></div>
               </div>`).join("")}</div>`

        $("profileTabContent").innerHTML = tabContent[0];

      function renderPayTable() {
        const h = ($("paySearch")?.value || "").toLowerCase();
        const f = $("payFilter")?.value || "";
        const pays = state.payments.filter((p) => {
          const st = getStudent(p.studentId);
          const tenantMatch = p.tenantId === state.currentTenantId;
          const nameMatch = !h || (st && st.name.toLowerCase().includes(h));
          const statusMatch = !f || p.status === f;
          return tenantMatch && nameMatch && statusMatch;
        });
        $("payTableBody").innerHTML = pays
          .map((p) => {
            const st = getStudent(p.studentId);
            const remaining = p.amount - p.paidAmount;
            return `<tr class="border-b border-gray-50 hover:bg-gray-50">
      <td class="px-4 py-3 font-medium">${st?.name || "Unknown"}</td>
      <td class="px-4 py-3 text-gray-500">${p.installment}</td>
      <td class="px-4 py-3">${fmt(p.amount)}</td>
      <td class="px-4 py-3 ${p.paidAmount < p.amount ? "text-amber-600" : "text-emerald-600"}">${fmt(p.paidAmount)}</td>
      <td class="px-4 py-3 text-gray-500">${p.dueDate}</td>
      <td class="px-4 py-3">${statusBadge(p.status)}</td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-2">
          ${p.status !== "completed" ? `<button onclick="markPaid('${p.id}')" class="text-xs px-2 py-1 bg-emerald-600 text-white rounded hover:bg-emerald-700 whitespace-nowrap">Mark Paid</button>` : '<span class="text-xs text-gray-400 inline-block w-[66px] text-center">—</span>'}
          <button onclick="openProfile('${p.studentId}'); setTimeout(() => document.querySelector('#profileTabs button[data-ptab=\\'2\\']').click(), 0);" class="p-1.5 hover:bg-gray-200 rounded text-gray-500 hover:text-gray-700 transition" title="View History"><i data-lucide="eye" class="w-4 h-4"></i></button>
        </div>
      </td>
    </tr>`;
          })
          .join("");
        lucide.createIcons();
      }
      window.markPaid = (id) => {
        const p = state.payments.find((x) => x.id === id);
        p.paidAmount = p.amount;
        p.status = "completed";
        p.paidDate = new Date().toISOString().split("T")[0];
        showToast("Payment marked as completed!");
        renderPayTable();
      };
